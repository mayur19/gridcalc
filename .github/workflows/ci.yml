name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Native PostgreSQL preinstalled on the runner (no containers).
      TEST_DATABASE_URL: postgres://gridcalc:gridcalc-ci-only@localhost:5432/gridcalc_test
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE gridcalc LOGIN PASSWORD 'gridcalc-ci-only'"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE gridcalc_test OWNER gridcalc"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
