openapi: 3.1.0
info:
  title: gridcalc API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description:
    'Full target API of gridcalc. Operations marked `x-status: implemented` are live; `x-status: pending`
    operations are registered and return 501 NOT_IMPLEMENTED with the backlog ticket (`x-ticket`). Every response
    uses the envelope `{ data, error, meta? }`.'
servers:
  - url: http://127.0.0.1:4107
    description: Local development
security:
  - sessionCookie: []
tags:
  - name: Health
  - name: Auth
  - name: Formulas
  - name: Workbooks
  - name: Sheets
  - name: Cells
  - name: Structure
  - name: Formatting
  - name: Sort and filter
  - name: Named ranges
  - name: Editing
  - name: Tracing
  - name: Pivots
  - name: Charts
  - name: Import and export
  - name: Collaboration
  - name: Comments
  - name: Versions
  - name: Sharing
  - name: Administration
  - name: Operations
paths:
  /api/v1/health/live:
    get:
      tags:
        - Health
      summary: Liveness probe
      operationId: getLiveness
      x-status: implemented
      security: []
      responses:
        '200':
          description: Process is up
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        const: ok
                      version:
                        type: string
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
  /api/v1/health/ready:
    get:
      tags:
        - Health
      summary: Readiness probe (database reachable and migrated)
      operationId: getReadiness
      x-status: implemented
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      status:
                        const: ready
                      database:
                        const: ok
                      migrations:
                        type: integer
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '503':
          description: Database unreachable or not migrated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register an organization and its owner; starts a session
      operationId: register
      x-status: implemented
      security: []
      description:
        Exempt from CSRF (no session yet) but the Origin header must match APP_ORIGIN. Rate limited per
        client IP (REGISTER_RATE_LIMIT_MAX). An already-registered email yields the generic REGISTRATION_REJECTED
        error so the response does not confirm account existence.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered; sets gc_session (HttpOnly) and gc_csrf cookies
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
          headers:
            Set-Cookie:
              schema:
                type: string
        '400':
          description: VALIDATION_FAILED or REGISTRATION_REJECTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Cross-origin request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Sign in with email and password
      operationId: login
      x-status: implemented
      security: []
      description:
        Throttled per normalized client IP, per distinct emails per IP, and per email with progressive
        backoff. Attempts are reserved before password verification. 429 responses carry Retry-After.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in; sets cookies
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: Invalid email or password (generic)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: No organization membership or cross-origin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke the current session
      operationId: logout
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Signed out; cookies cleared
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: object
                    properties:
                      signedOut:
                        const: true
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      summary: Current session, role, permissions and CSRF token
      operationId: getSession
      x-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/Session'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/formulas/functions:
    get:
      tags:
        - Formulas
      summary: Built-in function catalog
      operationId: listFunctions
      x-status: implemented
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Functions sorted by name; meta.count
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FunctionInfo'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/formulas/parse:
    post:
      tags:
        - Formulas
      summary: Syntax-check a formula and return its canonical form, AST and references
      operationId: parseFormula
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - formula
              properties:
                formula:
                  type: string
                  maxLength: 8192
                  examples:
                    - =SUM(A1:B2)*2
      responses:
        '200':
          description: Parse result
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/ParseResult'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/v1/workbooks:
    get:
      tags:
        - Workbooks
      summary: List workbooks of the organization
      operationId: listWorkbooks
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: Workbooks ordered by updatedAt desc; meta has total, limit, offset
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workbook'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Workbooks
      summary: Create a workbook with a default sheet "Sheet1"
      operationId: createWorkbook
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Created at revision 1
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbookDetail'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/workbooks/{workbookId}:
    get:
      tags:
        - Workbooks
      summary: Workbook with its sheets
      operationId: getWorkbook
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
      responses:
        '200':
          description: Workbook
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/WorkbookDetail'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - Workbooks
      summary: Renaming a workbook
      operationId: renamingAWorkbook
      x-status: pending
      x-ticket: GC-043
      description:
        Planned (backlog GC-043). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-043.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
    delete:
      tags:
        - Workbooks
      summary: Deleting a workbook
      operationId: deletingAWorkbook
      x-status: pending
      x-ticket: GC-043
      description:
        Planned (backlog GC-043). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-043.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/CsrfToken'
  /api/v1/workbooks/{workbookId}/sheets:
    post:
      tags:
        - Sheets
      summary: Add a sheet; formulas that referenced its name are rebound and recalculated
      operationId: createSheet
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: 'Cannot contain \ / ? * [ ] : or quotes; unique per workbook (case-insensitive)'
      responses:
        '201':
          description: Sheet added; new revision and recalculated cells
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/CommitResult'
                      - type: object
                        properties:
                          sheet:
                            $ref: '#/components/schemas/Sheet'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'CONFLICT: a sheet with that name exists'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/cells:
    get:
      tags:
        - Cells
      summary: Read non-empty cells of a sheet, optionally within an A1 range window
      operationId: listCells
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - name: range
          in: query
          schema:
            type: string
            examples:
              - A1:Z200
          description: A1 range; windows are limited to 250,000 cells. Omitted = whole sheet.
      responses:
        '200':
          description: Cells in row-major order; meta has revision and count
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Cell'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workbooks/{workbookId}/cells:
    patch:
      tags:
        - Cells
      summary: Apply a batch of cell edits and recalculate incrementally
      operationId: patchCells
      x-status: implemented
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/CsrfToken'
      description:
        'Optimistic concurrency: baseRevision must equal the workbook revision, otherwise 409 REVISION_CONFLICT
        with details.currentRevision. The response lists edited cells plus every recalculated cell whose value changed.
        An empty raw string clears a cell.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCellsRequest'
      responses:
        '200':
          description: Committed
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - error
                properties:
                  data:
                    $ref: '#/components/schemas/CommitResult'
                  error:
                    type: 'null'
                  meta:
                    type: object
                    additionalProperties: true
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: REVISION_CONFLICT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: 'PAYLOAD_TOO_LARGE: body too large or workbook cell limit exceeded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/workbooks/{workbookId}/duplicate:
    post:
      tags:
        - Workbooks
      summary: Duplicating a workbook
      operationId: duplicatingAWorkbook
      x-status: pending
      x-ticket: GC-043
      description:
        Planned (backlog GC-043). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-043.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}:
    patch:
      tags:
        - Sheets
      summary: Renaming or reordering a sheet
      operationId: renamingOrReorderingASheet
      x-status: pending
      x-ticket: GC-044
      description:
        Planned (backlog GC-044). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-044.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
    delete:
      tags:
        - Sheets
      summary: Deleting a sheet
      operationId: deletingASheet
      x-status: pending
      x-ticket: GC-044
      description:
        Planned (backlog GC-044). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-044.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/rows/insert:
    post:
      tags:
        - Structure
      summary: Inserting rows
      operationId: insertingRows
      x-status: pending
      x-ticket: GC-060
      description:
        Planned (backlog GC-060). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-060.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/rows/delete:
    post:
      tags:
        - Structure
      summary: Deleting rows
      operationId: deletingRows
      x-status: pending
      x-ticket: GC-060
      description:
        Planned (backlog GC-060). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-060.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/columns/insert:
    post:
      tags:
        - Structure
      summary: Inserting columns
      operationId: insertingColumns
      x-status: pending
      x-ticket: GC-061
      description:
        Planned (backlog GC-061). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-061.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/columns/delete:
    post:
      tags:
        - Structure
      summary: Deleting columns
      operationId: deletingColumns
      x-status: pending
      x-ticket: GC-061
      description:
        Planned (backlog GC-061). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-061.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/move-range:
    post:
      tags:
        - Structure
      summary: Moving a range
      operationId: movingARange
      x-status: pending
      x-ticket: GC-062
      description:
        Planned (backlog GC-062). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-062.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: Request shape defined when the ticket is implemented.
  /api/v1/workbooks/{workbookId}/sheets/{sheetId}/dimensions:
    put:
      tags:
        - Structure
      summary: Column widths and row heights
      operationId: columnWidthsAndRowHeights
      x-status: pending
      x-ticket: GC-053
      description:
        Planned (backlog GC-053). The route is registered and answers 501 NOT_IMPLEMENTED with error.details.ticket
        = GC-053.
      security:
        - sessionCookie: []
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
        '401':
          $ref: '#/components/responses/Unauthenticated'
      parameters:
        - $ref: '#/components/parameters/WorkbookId'
        - $ref: '#/components/parameters/SheetId'
