components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: gc_session
      description:
        Opaque session token (HttpOnly, SameSite=Lax). Mutating requests also need the x-csrf-token header
        equal to the session CSRF token (mirrored in the readable gc_csrf cookie) and an Origin matching APP_ORIGIN
        when present.
  parameters:
    CsrfToken:
      name: x-csrf-token
      in: header
      required: true
      schema:
        type: string
      description: Value of the gc_csrf cookie / Session.csrfToken
    WorkbookId:
      name: workbookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SheetId:
      name: sheetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ValidationFailed:
      description: VALIDATION_FAILED with details[] of {path, message}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthenticated:
      description: UNAUTHENTICATED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: FORBIDDEN or CSRF_TOKEN_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: NOT_FOUND (also returned for resources of other organizations)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotImplemented:
      description: Planned endpoint
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            data: null
            error:
              code: NOT_IMPLEMENTED
              message: Inserting rows is planned but not implemented yet
              details:
                ticket: GC-060
  schemas:
    ErrorEnvelope:
      type: object
      required:
        - data
        - error
      properties:
        data:
          type: 'null'
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - REGISTRATION_REJECTED
                - UNAUTHENTICATED
                - CSRF_TOKEN_INVALID
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - REVISION_CONFLICT
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL
                - NOT_IMPLEMENTED
            message:
              type: string
            details: {}
    RegisterRequest:
      type: object
      required:
        - organizationName
        - displayName
        - email
        - password
      properties:
        organizationName:
          type: string
          minLength: 2
          maxLength: 120
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 200
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 200
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            email:
              type: string
            displayName:
              type: string
        organization:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - editor
            - viewer
        permissions:
          type: array
          items:
            type: string
            enum:
              - workbook:read
              - workbook:create
              - workbook:write
              - workbook:delete
              - workbook:share
              - member:manage
              - audit:read
              - org:manage
        csrfToken:
          type: string
    FunctionInfo:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
          enum:
            - math
            - statistical
            - logical
            - text
            - lookup
            - info
        signature:
          type: string
        description:
          type: string
        minArgs:
          type: integer
        maxArgs:
          type: integer
    ParseResult:
      oneOf:
        - type: object
          properties:
            valid:
              const: true
            normalized:
              type: string
            ast:
              type: object
              description: AST node (see packages/shared/src/formula/ast.ts)
            references:
              type: object
              properties:
                cells:
                  type: array
                  items:
                    type: object
                ranges:
                  type: array
                  items:
                    type: object
        - type: object
          properties:
            valid:
              const: false
            message:
              type: string
            position:
              type: integer
              description: 0-based offset in the formula text
    Workbook:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        revision:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Sheet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer
        rowCount:
          type: integer
        colCount:
          type: integer
    WorkbookDetail:
      allOf:
        - $ref: '#/components/schemas/Workbook'
        - type: object
          properties:
            sheets:
              type: array
              items:
                $ref: '#/components/schemas/Sheet'
    CellValue:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          enum:
            - empty
            - number
            - string
            - boolean
            - error
        value:
          oneOf:
            - type: number
            - type: string
            - type: boolean
            - type: 'null'
          description: 'For errors the code, e.g. #DIV/0!, #CYCLE!'
        message:
          type: string
    Cell:
      type: object
      properties:
        sheetId:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 0
        col:
          type: integer
          minimum: 0
        raw:
          type: string
        value:
          $ref: '#/components/schemas/CellValue'
    CellEdit:
      type: object
      required:
        - sheetId
        - row
        - col
        - raw
      properties:
        sheetId:
          type: string
          format: uuid
        row:
          type: integer
          minimum: 0
          maximum: 1048575
        col:
          type: integer
          minimum: 0
          maximum: 16383
        raw:
          type: string
          maxLength: 8192
          description: What the user typed; "" clears the cell; leading = makes a formula
    PatchCellsRequest:
      type: object
      required:
        - baseRevision
        - edits
      properties:
        baseRevision:
          type: integer
          minimum: 0
        edits:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CellEdit'
    CommitResult:
      type: object
      properties:
        revision:
          type: integer
        changed:
          type: array
          items:
            $ref: '#/components/schemas/Cell'
        evaluated:
          type: integer
          description: Formulas evaluated (dirty set size)
        cycles:
          type: integer
          description: Evaluated cells that are members of a reference cycle
